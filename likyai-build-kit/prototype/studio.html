<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>likyAI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:ital,wght@0,400;1,400&display=swap">
<style>
:root{--bg:#f5f5f3;--dot:#cfcfcb;--surf:#fff;--ink:#17171a;--mute:#85858c;--line:#e7e7e3;--acc:#4a3df5;--accbg:#eeecff;--sh:0 1px 2px rgba(0,0,0,.04),0 8px 30px rgba(0,0,0,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--dot:#34343a;--surf:#1c1c20;--ink:#f2f2f4;--mute:#8d8d96;--line:#2c2c32;--acc:#8f86ff;--accbg:#26244a;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#121214;--dot:#34343a;--surf:#1c1c20;--ink:#f2f2f4;--mute:#8d8d96;--line:#2c2c32;--acc:#8f86ff;--accbg:#26244a;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Onest,system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;font-size:14px;-webkit-tap-highlight-color:transparent}
#board{position:fixed;inset:0;background-image:radial-gradient(var(--dot) 1.1px,transparent 1.1px);background-size:22px 22px;overflow:hidden}
.empty{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;color:var(--mute);pointer-events:none;transition:opacity .3s}
.empty b{display:block;color:var(--ink);font-weight:500;font-size:18px;margin-bottom:4px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:5}
.nav{pointer-events:auto;display:flex;gap:2px;padding:4px;background:var(--surf);border:1px solid var(--line);border-radius:999px;box-shadow:var(--sh)}
.nav button{padding:8px 18px;border-radius:999px;color:var(--mute);font-weight:500;transition:.15s}
.nav button.on{background:var(--ink);color:var(--bg)}
.avatar{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:16px;z-index:6}
.av{width:38px;height:38px;border-radius:50%;background:conic-gradient(from 200deg,#4a3df5,#e86bd0,#f5a53d,#4a3df5);padding:2px;box-shadow:var(--sh)}
.av i{display:block;width:100%;height:100%;border-radius:50%;background:var(--surf);font-style:normal;display:grid;place-items:center;font-weight:600;font-size:13px}
.menu{position:absolute;right:0;top:48px;width:236px;background:var(--surf);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:6px;display:none;transform-origin:top right}
.menu.open{display:block;animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.cred{padding:12px 12px 10px}
.cred small{color:var(--mute);display:block}
.cred strong{font-size:26px;font-weight:600;letter-spacing:-.02em}
.mi{display:flex;width:100%;align-items:center;padding:10px 12px;border-radius:10px;text-align:left;gap:8px}
.mi:hover{background:var(--bg)}
.mi.pri{background:var(--ink);color:var(--bg);justify-content:center;font-weight:500;margin:2px 0 6px}
.mi.pri:hover{opacity:.9;background:var(--ink)}
.hr{height:1px;background:var(--line);margin:4px 6px}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(680px,calc(100vw - 24px));z-index:4}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:10px}
.types button{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;box-shadow:var(--sh);transition:.15s}
.types button:hover{border-color:var(--acc);transform:translateY(-2px)}
.types b{display:block;font-weight:500}
.types span{color:var(--mute);font-size:12px}
.bubble{background:var(--surf);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh);padding:12px 12px 10px}
textarea{width:100%;border:0;background:none;resize:none;outline:0;min-height:44px;max-height:140px;padding:4px 6px;line-height:1.5}
textarea::placeholder{color:var(--mute)}
.row{display:flex;align-items:flex-end;gap:8px;margin-top:6px}
.chip{position:relative;display:inline-flex;align-items:center;background:var(--bg);border-radius:999px;padding:0 4px 0 10px;height:32px;gap:4px;color:var(--mute);font-size:12.5px;max-width:100%}
.chip select,.chip input{appearance:none;-webkit-appearance:none;background:none;border:0;outline:0;color:var(--ink);font-weight:500;height:32px;padding:0 10px 0 0;font-size:12.5px;max-width:150px;cursor:pointer}
.chip input[type=text]{width:130px;cursor:text}
.chip input[type=file]{display:none}
.chip.file{cursor:pointer;padding-right:10px;color:var(--ink);font-weight:500}
.tag{background:var(--accbg);color:var(--acc);font-weight:500;border-radius:999px;height:32px;padding:0 12px;font-size:12.5px}
.go{margin-left:auto;background:var(--ink);color:var(--bg);height:36px;border-radius:999px;padding:0 16px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.go small{opacity:.65;font-weight:400}
.go:active{transform:scale(.97)}
.card{position:absolute;border-radius:16px;background:var(--surf);border:1px solid var(--line);box-shadow:var(--sh);overflow:hidden;touch-action:none;cursor:grab;user-select:none;animation:pop .25s ease-out}
.card.drag{cursor:grabbing;z-index:3}
.art{position:absolute;inset:0}
.cap{position:absolute;left:0;right:0;bottom:0;padding:24px 12px 10px;color:#fff;font-size:12px;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.load{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:12px;background:linear-gradient(110deg,var(--surf) 30%,var(--bg) 50%,var(--surf) 70%);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.scrim{position:fixed;inset:0;background:rgba(10,10,14,.35);display:none;place-items:center;z-index:10;padding:16px}
.scrim.open{display:grid}
.modal{background:var(--surf);border-radius:22px;width:min(400px,100%);padding:20px;box-shadow:var(--sh);animation:pop .16s ease-out}
.modal h3{margin:0 0 4px;font-size:18px;font-weight:600;letter-spacing:-.01em}
.modal p{margin:0 0 14px;color:var(--mute)}
.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.packs button,.ops button{border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.packs button.on,.ops button.on{border-color:var(--acc);background:var(--accbg)}
.packs b{display:block;font-size:16px}
.packs span{font-size:12px;color:var(--mute)}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;outline:0;margin-bottom:12px}
.field:focus{border-color:var(--acc)}
.pay{width:100%;background:var(--ink);color:var(--bg);border-radius:12px;padding:13px;font-weight:500}
.x{display:block;margin:10px auto 0;color:var(--mute)}
.toast{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}
:root[data-theme="light"]{color-scheme:light}:root[data-theme="dark"]{color-scheme:dark}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.theme{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:62px;width:38px;height:38px;border-radius:50%;background:var(--surf);border:1px solid var(--line);box-shadow:var(--sh);display:grid;place-items:center;z-index:6;color:var(--ink)}
.theme svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.types button:last-child:nth-child(odd){grid-column:1/-1}
@media(max-width:640px){
.nav button{padding:8px 14px}
.dock{width:calc(100vw - 16px);bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.bubble{border-radius:20px;padding:10px}
textarea,.chip input[type=text]{font-size:16px}
.row{flex-direction:column;align-items:stretch}
.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip,.tag{flex:none}
.go{width:100%;justify-content:center;height:44px;margin:0}
.types{grid-template-columns:1fr 1fr}
.types button{padding:10px}
.avatar{right:12px}.theme{right:58px}
.scrim{align-items:end;padding:0}
.modal{width:100%;border-radius:22px 22px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.empty{width:100%;padding:0 28px;top:36%}
}
@media(max-height:520px){.empty{display:none}}
:root{--bg:#f8f8f5;--dot:#deded8;--surf:#fcfcfa;--ink:#171717;--mute:#7d7d78;--line:#e2e2dc;--mn:#eaeae5;--lime:#d8ff64;--acc:#171717;--accbg:#d8ff64;--sh:0 1px 2px rgba(23,23,23,.04),0 6px 24px rgba(23,23,23,.06)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121211;--dot:#2c2c2a;--surf:#1b1b1a;--ink:#f8f8f5;--mute:#8f8f89;--line:#2e2e2b;--mn:#262624;--acc:#d8ff64;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#121211;--dot:#2c2c2a;--surf:#1b1b1a;--ink:#f8f8f5;--mute:#8f8f89;--line:#2e2e2b;--mn:#262624;--acc:#d8ff64;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.4)}
body{font-family:Geist,system-ui,sans-serif}
.empty em{display:block;font-family:Sentient,Newsreader,Georgia,serif;font-style:italic;font-size:32px;line-height:1.15;color:var(--ink);margin-bottom:8px}
.modal h3,.logo span,.av i{font-family:Sentient,Newsreader,Georgia,serif;font-weight:400}
.modal h3{font-size:24px}
.logo{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:16px;z-index:5;display:flex;align-items:center;gap:8px}
.logo b{width:28px;height:28px;border-radius:9px;background:var(--lime);display:grid;place-items:center}
.logo svg{width:16px;height:16px;fill:#171717}
.logo span{font-size:25px;line-height:1;letter-spacing:-.01em}
.nav{border-radius:16px}.nav button{border-radius:12px;white-space:nowrap}

.chip:focus-within{box-shadow:0 0 0 2px var(--lime)}
.tag{background:var(--ink);color:var(--bg);border-radius:12px}
.go{background:var(--lime);color:#171717;border-radius:14px}
.card{background:var(--mn)}
.art{filter:saturate(.18)}
.art::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 82% 14%,rgba(216,255,100,.6),transparent 42%)}
:focus-visible{outline:2px solid var(--ink)}
.field{background:var(--mn)}.field:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--lime)}
.packs button.on,.ops button.on{background:var(--lime);border-color:#171717;color:#171717}

.modal{border-radius:20px}
.types button:hover{border-color:var(--ink)}
.hr2{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.hr2 span{color:var(--mute);font-size:12px}
@media(max-width:640px){.top{top:calc(64px + env(safe-area-inset-top,0px))}.nav button{padding:8px 12px;font-size:13px}.logo{left:14px}}
.ic{display:block;flex:none;width:44px;height:44px;border-radius:12px;background:#f8f8f5 center/cover no-repeat;box-shadow:0 0 0 1px rgba(23,23,23,.07)}
.ic.sm{width:36px;height:36px;border-radius:10px}
.ic.big{width:96px;height:96px;border-radius:24px;margin:0 auto 16px}

.nav button.on{color:#171717}
.cred{display:flex;align-items:center;gap:12px}.cred .ic{width:52px;height:52px;border-radius:14px}
.mi{gap:10px}.mi .ic{margin-left:-6px}
@media(max-width:640px){.nav button{padding:6px 8px 7px;font-size:12px}.ic{width:40px;height:40px}.ic.big{width:84px;height:84px}}
.ic{background-color:transparent;box-shadow:none}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .ic{background-color:transparent;box-shadow:none}}
:root[data-theme="dark"] .ic{background-color:transparent;box-shadow:none}
.nav button{position:relative}
.nav button.on{background:var(--mn);color:var(--ink)}
.nav button.on::after{content:"";position:absolute;bottom:2px;left:50%;width:16px;height:3px;border-radius:3px;background:var(--ink);transform:translateX(-50%)}
.ic{background-image:var(--il)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .ic{background-image:var(--id)}}
:root[data-theme="dark"] .ic{background-image:var(--id)}
.types button{position:relative;overflow:hidden}
.types button>*{position:relative}

.types button:hover::before{opacity:.85}
.art.org{background:#f8f8f5 var(--oa) var(--px) var(--py)/150% no-repeat!important;filter:none}

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .art.org{filter:invert(1) hue-rotate(180deg)}:root:not([data-theme="light"]) .types button::before{filter:invert(1) hue-rotate(180deg);mix-blend-mode:screen;opacity:.4}}
:root[data-theme="dark"] .art.org{filter:invert(1) hue-rotate(180deg)}
:root[data-theme="dark"] .types button::before{filter:invert(1) hue-rotate(180deg);mix-blend-mode:screen;opacity:.4}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="board"><div class="empty" id="empty"><i class="ic big" data-i="creation"></i><em>Tes idées prennent vie.</em>Décris ton idée et lance la création.</div></div>

<div class="logo"><b><svg viewBox="0 0 24 24"><path d="M12 2c.6 5.4 4.6 9.4 10 10-5.4.6-9.4 4.6-10 10-.6-5.4-4.6-9.4-10-10 5.4-.6 9.4-4.6 10-10z"/></svg></b><span>likyAI</span></div>
<div class="top"><div class="nav" id="nav"><button data-m="image" class="on"><i class="ic" data-i="image"></i>Image</button><button data-m="video"><i class="ic" data-i="video"></i>Vidéo</button><button data-m="music"><i class="ic" data-i="musique"></i>Musique</button><button data-m="voice"><i class="ic" data-i="voix"></i>Voix off</button></div></div>

<div class="avatar">
  <button class="av" id="av" aria-label="Profil"><i>A</i></button>
  <div class="menu" id="menu">
    <div class="cred"><i class="ic" data-i="credits"></i><div><small>Crédits</small><strong id="credits">0</strong></div></div>
    <button class="mi pri" id="topup">Recharger</button>
    <button class="mi" id="hs"><i class="ic sm" data-i="bibliotheque"></i>Historique</button>
    <button class="mi" id="st"><i class="ic sm" data-i="parametres"></i>Paramètres</button>
    <div class="hr"></div>
    <button class="mi" id="out">Se déconnecter</button>
  </div>
</div>

<button class="theme" id="theme" aria-label="Changer de thème"></button>
<div class="dock" id="dock"></div>

<div class="scrim" id="scrim">
  <div class="modal">
    <h3>Recharger mes crédits</h3>
    <p>Paiement par mobile money, sans carte bancaire.</p>
    <div class="packs" id="packs"></div>
    <div class="ops" id="ops"><button data-o="MTN MoMo" class="on">MTN MoMo</button><button data-o="Orange Money">Orange Money</button></div>
    <input class="field" id="phone" type="tel" inputmode="tel" placeholder="Numéro mobile money (ex. 6 70 00 00 00)">
    <button class="pay" id="pay">Payer</button>
    <button class="x" id="close">Annuler</button>
  </div>
</div>
<div class="scrim" id="scrim2"><div class="modal"><h3>Historique</h3><p>Tes recharges et créations récentes.</p><div id="hist"></div><button class="x" id="close2">Fermer</button></div></div>
<div class="scrim" id="scrim3"><div class="modal"><h3>Paramètres</h3><p>Choisis l'apparence de likyAI.</p><div class="ops" id="themeOps" style="grid-template-columns:repeat(3,1fr)"><button data-t="light">Clair</button><button data-t="dark">Sombre</button><button data-t="auto">Auto</button></div><button class="x" id="close3">Fermer</button></div></div>
<div class="toast" id="toast"></div>

<script>
// ---- Configuration (à relier à l'API Higgsfield + au paiement mobile money côté serveur)
var MODELS={

};

var PLATFORMS={'TikTok':'9:16','Reels Instagram':'9:16','YouTube Shorts':'9:16','Facebook':'4:5','YouTube':'16:9','LinkedIn':'1:1'};
var VTYPES={

    f:[{k:'Plateforme',o:Object.keys(PLATFORMS)},{k:'Avatar',o:['Femme','Homme','Jeune','Senior']},{k:'Langue',o:['Français','Anglais']},{k:'Durée',o:['10 s','15 s','30 s']}]},

  saas:{n:'Présentation SaaS',d:'Démo d\'un logiciel',ph:'Ex. Présenter mon application de gestion de stock en 3 temps forts…',
    f:[{k:'Site du produit',t:'https://…'},{k:'Format',o:Object.keys(PLATFORMS)},{k:'Style',o:['Minimal','Dynamique','Corporate']},{k:'Durée',o:['10 s','15 s','30 s']}]},
  libre:{n:'Libre',d:'Tu décides de tout',ph:'Décris la scène que tu imagines…',

};
var PACKS=[{f:1000,c:50},{f:2500,c:140},{f:5000,c:300}];
var S={mode:'image',vt:null,credits:60,pack:1,op:'MTN MoMo',n:0,vals:{},log:[]};

function sel(key,label,opts,def){
  var v=S.vals[key]||(S.vals[key]=def||opts[0]);
  return '<label class="chip">'+(label?label+'':'')+'<select data-k="'+key+'" aria-label="'+(label||key)+'">'+opts.map(function(o){return '<option'+(o===v?' selected':'')+'>'+o+'</option>'}).join('')+'</select></label>';
}
function cost(){
  if(S.mode==='music')return 10*Math.ceil((parseInt(S.vals['MDurée'])||30)/15);
  if(S.mode==='voice')return Math.max(2,2*Math.ceil((S.vals.prompt||'').length/100));
  if(S.mode==='image'){var m=MODELS.image.find(function(x){return x.id===S.vals.model});var qi=m.q.indexOf(S.vals.qual);if(qi<0)qi=0;
    return Math.round(m.base*m.qm[qi]*(+S.vals.count||1))}
  var m2=MODELS.video.find(function(x){return x.id===S.vals.vmodel});var d=parseInt(S.vals['Durée'])||5;
  return m2.base*d;
}
function render(){
  var h='';
  if(S.mode==='video'&&!S.vt){
    h+='<div class="types">'+Object.keys(VTYPES).map(function(k,i){return '<button class="o'+(i%4)+'" data-t="'+k+'"><b>'+VTYPES[k].n+'</b><span>'+VTYPES[k].d+'</span></button>'}).join('')+'</div>';
    $('dock').innerHTML=h;return;
  }
  var ph,chips='';
  if(S.mode==='image'){
    var ms=MODELS.image;
    if(!S.vals.model)S.vals.model=ms[0].id;
    var m=ms.find(function(x){return x.id===S.vals.model});
    if(m.q.indexOf(S.vals.qual)<0)S.vals.qual=m.q[0];
    ph='Décris l\'image que tu veux générer…';
    chips='<label class="chip">Modèle<select data-k="model">'+ms.map(function(x){return '<option value="'+x.id+'"'+(x.id===S.vals.model?' selected':'')+'>'+x.n+' · '+x.base+' cr</option>'}).join('')+'</select></label>'
      +sel('format','',Object.keys(FORMATS))
      +sel('count','Nombre',['1','2','3','4'])
      +sel('qual','Qualité',m.q)
      +sel('style','',['Photo réaliste','Produit','Portrait','Illustration','3D','Affiche']);
  }else if(S.mode==='music'){
    ph='Décris la musique : ambiance, rythme, instruments…';
    chips=sel('Genre','Genre',['Afrobeat','Amapiano','Pop','Lo-fi','Cinématique','Gospel'])+sel('MDurée','Durée',['15 s','30 s','60 s'],'30 s')+sel('Vocal','',['Instrumental','Avec voix']);
  }else if(S.mode==='voice'){
    ph='Écris le texte à dire à voix haute…';
    chips=sel('Voix','Voix',['Femme chaleureuse','Homme posé','Jeune dynamique','Narrateur'])+sel('Langue','Langue',['Français','Anglais'])+sel('Vitesse','',['Normale','Lente','Rapide']);
  }else{
    var t=VTYPES[S.vt];ph=t.ph;
    if(!S.vals.vmodel)S.vals.vmodel=MODELS.video[0].id;
    chips='<button class="tag" data-back="1">'+t.n+' ×</button>'
      +'<label class="chip">Modèle<select data-k="vmodel">'+MODELS.video.map(function(x){return '<option value="'+x.id+'"'+(x.id===S.vals.vmodel?' selected':'')+'>'+x.n+' · '+x.base+' cr/s</option>'}).join('')+'</select></label>';
    t.f.forEach(function(f){
      if(f.o)chips+=sel(f.k,f.k,f.o);
      else if(f.t)chips+='<label class="chip">'+f.k+'<input type="text" data-k="'+f.k+'" placeholder="'+f.t+'" value="'+(S.vals[f.k]||'')+'"></label>';
      else if(f.file)chips+='<label class="chip file" id="fl">'+(S.vals.fileName||'Ajouter une image')+'<input type="file" accept="image/*" id="fin"></label>';
    });
  }
  h='<div class="bubble"><textarea id="prompt" rows="2" placeholder="'+ph+'">'+(S.vals.prompt||'')+'</textarea><div class="row"><div class="chips">'+chips+'</div><button class="go" id="go">Générer <small>'+cost()+' cr</small></button></div></div>';
  $('dock').innerHTML=h;
  var ta=$('prompt');ta.oninput=function(){S.vals.prompt=ta.value;var g=$('go');if(g)g.querySelector('small').textContent=cost()+' cr';ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,140)+'px'};
  var fin=$('fin');if(fin)fin.onchange=function(){S.vals.fileName=fin.files[0]?fin.files[0].name.slice(0,18):'';render()};
}

    var dh=$('dock').offsetHeight+28;var lo=window.innerWidth<=640?156:104,hi=Math.max(lo,bh-H-dh-10);var y=lo+Math.random()*(hi-lo);
    el.style.left=x+'px';el.style.top=y+'px';el.style.zIndex=++S.n;
    el.innerHTML='<div class="load">En attente…</div>';setTimeout(function(){var l=el.querySelector('.load');if(l)l.textContent='Création en cours…'},700);
    $('board').appendChild(el);drag(el);
    setTimeout(function(){
      var h=HUES[Math.floor(Math.random()*HUES.length)];
      el.innerHTML='<div class="art'+(aud?'':' org o'+Math.floor(Math.random()*4))+'" style="--px:'+Math.random()*100+'%;--py:'+Math.random()*100+'%;background:radial-gradient(circle at '+(20+Math.random()*60)+'% '+(20+Math.random()*50)+'%,hsl('+h[0]+' 85% 70%),hsl('+h[1]+' 70% 45%) 70%,hsl('+h[1]+' 50% 22%))"></div><div class="cap">'+(aud?(S.mode==='music'?'Musique · ':'Voix off · '):isImg?'':(VTYPES[S.vt].n+' · '))+p.slice(0,46)+(p.length>46?'…':'')+'</div>';
    if(aud){var w='';for(var b=0;b<28;b++)w+='<i style="flex:1;border-radius:2px;background:#fff;opacity:.85;height:'+(12+Math.random()*60)+'%"></i>';var a=el.querySelector('.art');a.style.display='flex';a.style.alignItems='center';a.style.gap='3px';a.style.padding='0 18px 34px';a.insertAdjacentHTML('beforeend',w)}if(i===count-1)toast('Ta création est prête.');},1800+i*400);
  })(i);
  S.vals.prompt='';render();
}
function drag(el){
  var sx,sy,ox,oy,on=false;
  el.addEventListener('pointerdown',function(e){on=true;sx=e.clientX;sy=e.clientY;ox=el.offsetLeft;oy=el.offsetTop;el.setPointerCapture(e.pointerId);el.classList.add('drag');el.style.zIndex=++S.n});
  el.addEventListener('pointermove',function(e){if(!on)return;el.style.left=(ox+e.clientX-sx)+'px';el.style.top=(oy+e.clientY-sy)+'px'});
  var end=function(){on=false;el.classList.remove('drag')};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
// menu + recharge
$('av').onclick=function(e){e.stopPropagation();$('menu').classList.toggle('open')};
document.addEventListener('click',function(e){if(!e.target.closest('.avatar'))$('menu').classList.remove('open')});
function openTop(){$('menu').classList.remove('open');$('scrim').classList.add('open')}
$('topup').onclick=openTop;
$('close').onclick=function(){$('scrim').classList.remove('open')};
$('scrim').onclick=function(e){if(e.target===$('scrim'))$('scrim').classList.remove('open')};
$('packs').innerHTML=PACKS.map(function(p,i){return '<button data-i="'+i+'" class="'+(i===S.pack?'on':'')+'"><b>'+p.c+'</b><span>'+p.f.toLocaleString('fr-FR')+' FCFA</span></button>'}).join('');
$('packs').onclick=function(e){var b=e.target.closest('button');if(!b)return;S.pack=+b.dataset.i;[].forEach.call($('packs').children,function(x){x.classList.toggle('on',x===b)})};
$('ops').onclick=function(e){var b=e.target.closest('button');if(!b)return;S.op=b.dataset.o;[].forEach.call($('ops').children,function(x){x.classList.toggle('on',x===b)})};
$('pay').onclick=function(){
  if($('phone').value.replace(/\D/g,'').length<8){toast('Entre un numéro valide');return}
  // Ici: appeler ton backend (agrégateur mobile money), puis créditer le compte à la confirmation du paiement.
  S.credits+=PACKS[S.pack].c;save();S.log.unshift({t:'Recharge '+S.op,d:PACKS[S.pack].f+' FCFA',v:PACKS[S.pack].c});$('scrim').classList.remove('open');toast('+'+PACKS[S.pack].c+' crédits ajoutés (démo)');
};
$('out').onclick=function(){$('menu').classList.remove('open');toast('Déconnecté (démo)')};
// thème clair / sombre
var SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
var MOON='<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>';
var mq=window.matchMedia('(prefers-color-scheme: dark)');
function isDark(){var t=document.documentElement.dataset.theme;return t?t==='dark':mq.matches}
function paintTheme(){$('theme').innerHTML=isDark()?SUN:MOON;$('theme').title=isDark()?'Passer en clair':'Passer en sombre'}
try{var th=localStorage.getItem('studio_theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
$('theme').onclick=function(){var n=isDark()?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('studio_theme',n)}catch(e){}paintTheme()};
if(mq.addEventListener)mq.addEventListener('change',paintTheme);
paintTheme();
$('hs').onclick=function(){$('menu').classList.remove('open');$('hist').innerHTML=S.log.length?S.log.map(function(l){return '<div class="hr2"><div>'+l.t+'<br><span>'+l.d+'</span></div><b>'+(l.v>0?'+':'')+l.v+' cr</b></div>'}).join(''):'<p>Aucune transaction pour le moment.</p>';$('scrim2').classList.add('open')};
$('close2').onclick=function(){$('scrim2').classList.remove('open')};
$('scrim2').onclick=function(e){if(e.target===$('scrim2'))$('scrim2').classList.remove('open')};
function curTheme(){return document.documentElement.dataset.theme||'auto'}
function paintSet(){[].forEach.call($('themeOps').children,function(b){b.classList.toggle('on',b.dataset.t===curTheme())})}
function setTheme(t){if(t==='auto'){delete document.documentElement.dataset.theme;try{localStorage.removeItem('studio_theme')}catch(e){}}else{document.documentElement.dataset.theme=t;try{localStorage.setItem('studio_theme',t)}catch(e){}}paintTheme();paintSet()}
$('themeOps').onclick=function(e){var b=e.target.closest('button');if(b)setTheme(b.dataset.t)};
$('st').onclick=function(){$('menu').classList.remove('open');paintSet();$('scrim3').classList.add('open')};
$('close3').onclick=function(){$('scrim3').classList.remove('open')};
$('scrim3').onclick=function(e){if(e.target===$('scrim3'))$('scrim3').classList.remove('open')};
save();render();
